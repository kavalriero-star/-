# 박스 격자(칸) 정의
#
# 박스가 카메라에 약간 기울어져 보이므로, 박스 안쪽 4개 모서리를 지정하는
# perspective(원근) 방식을 사용합니다. 4개 모서리를 기준으로 rows x cols 칸을
# 균등 분할합니다.
#
# 좌표는 "원본 이미지 픽셀" 기준입니다. (data/samples/box.jpg = 3000(가로)x4000(세로))
# 정확한 좌표는 다음 명령으로 보정하세요:
#   python -m src.calibrate_grid --image data/samples/box.jpg
#
# corners 순서: 좌상(tl) -> 우상(tr) -> 우하(br) -> 좌하(bl)

mode: perspective

rows: 4
cols: 4

# 아래 값은 샘플 이미지 기준 대략적인 초기값입니다. 반드시 보정하여 사용하세요.
corners:
  tl: [440, 870]
  tr: [2480, 720]
  br: [2660, 3180]
  bl: [380, 3320]

# 판정 옵션
detection:
  # YOLO 검출 박스 중심이 칸 안에 있고 conf 가 이 값 이상이면 "있음"으로 판정
  conf_threshold: 0.40

# YOLO 모델이 없을 때 사용하는 백업 판정 (칸 내부 어두운 픽셀 비율 기반)
fallback:
  enabled: true
  # 빈 칸은 채도 높은 '파란 박스 색'으로 거의 가득 찹니다. 따라서 파란 범위에 들지
  # 않는(=제품) 픽셀 비율을 점유 신호로 사용합니다. 제품 색에 무관하게 동작합니다.
  blue_hue: [95, 130]   # 파란색으로 볼 HSV Hue 범위 (0-179)
  blue_sat_min: 120     # 파란색으로 볼 최소 채도 S (0-255)
  # 칸 면적 대비 '파란색이 아닌' 픽셀 비율이 이 값 이상이면 "있음"으로 판정
  object_ratio_threshold: 0.20
