<title>가스켓 라인 3D 레이아웃</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #ecece8;
    --panel: rgba(255, 255, 255, 0.88);
    --panel-line: rgba(28, 35, 48, 0.12);
    --ink: #1c2330;
    --muted: #5d6573;
    --accent: #2f6fdc;
    --accent-ink: #ffffff;
    --chip-line: rgba(28, 35, 48, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1d21;
      --panel: rgba(30, 33, 39, 0.9);
      --panel-line: rgba(255, 255, 255, 0.12);
      --ink: #eef0f3;
      --muted: #a2a9b4;
      --accent: #5b8ff0;
      --accent-ink: #0f1420;
      --chip-line: rgba(255, 255, 255, 0.2);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1d21;
    --panel: rgba(30, 33, 39, 0.9);
    --panel-line: rgba(255, 255, 255, 0.12);
    --ink: #eef0f3;
    --muted: #a2a9b4;
    --accent: #5b8ff0;
    --accent-ink: #0f1420;
    --chip-line: rgba(255, 255, 255, 0.2);
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    overflow: hidden;
  }
  #app { position: fixed; inset: 0; }
  #view { position: absolute; inset: 0; touch-action: none; cursor: grab; }
  #view.dragging { cursor: grabbing; }
  canvas { display: block; }

  .panel {
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 14px 16px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
  }
  #ctl { top: 16px; left: 16px; width: 248px; }
  #ctl h1 {
    margin: 0 0 2px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  #ctl .sub { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
  .row-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 12px 0 6px;
  }
  .views { display: flex; gap: 6px; }
  .views button {
    flex: 1;
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    padding: 6px 0;
    border-radius: 6px;
    border: 1px solid var(--chip-line);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .views button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .views button:focus-visible, .toggles input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .toggles label { display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; }
  .toggles input { accent-color: var(--accent); margin: 0; width: 15px; height: 15px; }

  #legend { left: 16px; bottom: 16px; padding: 10px 14px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; }
  #legend span { display: inline-flex; align-items: center; gap: 6px; }
  #legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--chip-line); }
  #legend i.dash { width: 18px; height: 0; border: 0; border-top: 2px dashed #2f6fdc; border-radius: 0; }

  #hint { right: 16px; bottom: 16px; padding: 8px 12px; font-size: 12px; color: var(--muted); }
  #tip {
    position: absolute;
    pointer-events: none;
    padding: 4px 9px;
    font-size: 12.5px;
    font-weight: 500;
    background: var(--ink);
    color: var(--bg);
    border-radius: 5px;
    transform: translate(12px, 14px);
    white-space: nowrap;
  }
  #loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 13px; color: var(--muted); background: var(--bg);
  }
  @media (max-width: 640px) {
    #ctl { width: auto; right: 16px; }
    #hint { display: none; }
    #legend { right: 16px; }
  }
</style>

<div id="app">
  <div id="view"></div>
  <div id="loading">3D 모델 구성 중…</div>

  <section id="ctl" class="panel" aria-label="보기 설정">
    <h1>가스켓 라인 3D 레이아웃</h1>
    <p class="sub">60 m × 30 m · 도포(Gasket) → screw 공정 → 검사/라벨 → 포장</p>

    <div class="row-label">시점</div>
    <div class="views" role="group" aria-label="카메라 시점">
      <button type="button" data-view="iso" aria-pressed="true">등각</button>
      <button type="button" data-view="top" aria-pressed="false">평면</button>
      <button type="button" data-view="front" aria-pressed="false">정면</button>
      <button type="button" data-view="back" aria-pressed="false">후면</button>
    </div>

    <div class="row-label">표시</div>
    <div class="toggles">
      <label><input type="checkbox" data-layer="labels" checked> 이름표</label>
      <label><input type="checkbox" data-layer="workers" checked> 작업자</label>
      <label><input type="checkbox" data-layer="zones" checked> 구역선</label>
      <label><input type="checkbox" data-layer="grid"> 2 m 격자</label>
    </div>
  </section>

  <div id="legend" class="panel" aria-label="범례">
    <span><i style="background:#f6f6f3"></i>설비·구조물</span>
    <span><i style="background:#b4b9c0"></i>대차·프레임</span>
    <span><i style="background:#1f63c8"></i>작업자</span>
    <span><i style="background:#3f8f4e"></i>로봇·라벨</span>
    <span><i style="background:#7a4a2a"></i>안전문</span>
    <span><i class="dash"></i>구역선</span>
  </div>

  <div id="hint" class="panel">드래그 회전 · 휠 확대 · Shift+드래그 이동 · 설비에 마우스를 올리면 이름 표시</div>
  <div id="tip" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  if (!window.THREE) {
    document.getElementById('loading').textContent = '3D 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인해 주세요.';
    return;
  }
  // 이름표를 캔버스에 그리므로 웹폰트가 준비된 뒤 씬을 구성한다 (최대 1.5초 대기)
  const fontReady = (document.fonts && document.fonts.load)
    ? Promise.race([document.fonts.load('600 44px "IBM Plex Sans KR"'), new Promise(res => setTimeout(res, 1500))]).catch(() => null)
    : Promise.resolve();
  fontReady.then(main, main);

  function main() {

  // ---------- 공장 규격 (단위: m) ----------
  const F = { W: 60, D: 30, wallH: 2.6, wallT: 0.8 };

  const COL = {
    white: 0xf6f6f3, panel: 0xeceded, floor: 0xe3e3de, apron: 0xd3d3ce,
    metal: 0xb4b9c0, steel: 0x8b9096, dark: 0x4a4f56, rubber: 0x2c2f33,
    blue: 0x1f63c8, blueLight: 0x3b7fe0, skin: 0xe8c9a6,
    green: 0x3f8f4e, greenDark: 0x2c6b39, wood: 0x7a4a2a, woodDark: 0x54321a,
    yellow: 0xd9a531, zone: 0x2f6fdc, grid: 0xb9bcc4
  };
  const matCache = new Map();
  function M(hex, extra) {
    const key = hex + JSON.stringify(extra || {});
    if (!matCache.has(key)) {
      matCache.set(key, new THREE.MeshStandardMaterial(Object.assign({
        color: new THREE.Color(hex).convertSRGBToLinear(), roughness: 0.78, metalness: 0.12
      }, extra || {})));
    }
    return matCache.get(key);
  }

  // ---------- 렌더러 / 씬 ----------
  const viewEl = document.getElementById('view');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  viewEl.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xecece8).convertSRGBToLinear();

  const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 500);
  const TARGET = new THREE.Vector3(F.W / 2, 0, F.D / 2 - 1);

  const hemi = new THREE.HemisphereLight(0xffffff, 0xcfcfc8, 0.85);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(F.W / 2 + 25, 60, F.D / 2 + 40);
  sun.target.position.copy(TARGET);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const sc = sun.shadow.camera;
  sc.left = -45; sc.right = 45; sc.top = 40; sc.bottom = -40; sc.near = 10; sc.far = 160;
  sun.shadow.bias = -0.0006;
  scene.add(sun); scene.add(sun.target);

  // 레이어 그룹
  const L = {
    labels: new THREE.Group(), workers: new THREE.Group(), zones: new THREE.Group(), grid: new THREE.Group()
  };
  Object.values(L).forEach(g => scene.add(g));
  L.grid.visible = false;

  // ---------- 기본 도형 헬퍼 ----------
  function group(name, parent) {
    const g = new THREE.Group();
    if (name) g.userData.name = name;
    (parent || scene).add(g);
    return g;
  }
  function box(parent, w, h, d, x, z, m, y) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    mesh.position.set(x, (y || 0) + h / 2, z);
    mesh.castShadow = mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
  }
  function cyl(parent, r, h, x, z, m, y, seg) {
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg || 28), m);
    mesh.position.set(x, (y || 0) + h / 2, z);
    mesh.castShadow = mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
  }
  // x축 방향으로 눕힌 원통 (롤러, 바퀴 축 등)
  function rollerX(parent, r, len, x, y, z, m) {
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 20), m);
    mesh.rotation.z = Math.PI / 2;
    mesh.position.set(x, y, z);
    mesh.castShadow = mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
  }
  function sphere(parent, r, x, y, z, m) {
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 16), m);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    parent.add(mesh);
    return mesh;
  }

  // ---------- 이름표 (캔버스 스프라이트) ----------
  function label(text, x, y, z, opts) {
    opts = opts || {};
    const lines = text.split('\n');
    const fs = 44, pad = 16, lh = fs * 1.22;
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    const font = `600 ${fs}px "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
    ctx.font = font;
    const tw = Math.max.apply(null, lines.map(l => ctx.measureText(l).width));
    c.width = Math.ceil(tw + pad * 2);
    c.height = Math.ceil(lines.length * lh + pad * 2);
    ctx.font = font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // 반투명 흰 바탕
    ctx.fillStyle = 'rgba(255,255,255,0.82)';
    const r = 14;
    ctx.beginPath();
    ctx.moveTo(r, 0); ctx.lineTo(c.width - r, 0); ctx.quadraticCurveTo(c.width, 0, c.width, r);
    ctx.lineTo(c.width, c.height - r); ctx.quadraticCurveTo(c.width, c.height, c.width - r, c.height);
    ctx.lineTo(r, c.height); ctx.quadraticCurveTo(0, c.height, 0, c.height - r);
    ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = opts.color || '#1c2330';
    lines.forEach((l, i) => ctx.fillText(l, c.width / 2, pad + lh * (i + 0.5)));

    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.minFilter = THREE.LinearFilter;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, depthWrite: false, transparent: true }));
    const H = (opts.size || 0.95) * lines.length + 0.35;
    sp.scale.set(H * c.width / c.height, H, 1);
    sp.position.set(x, y, z);
    sp.renderOrder = 999;
    L.labels.add(sp);
    return sp;
  }

  // ---------- 구성 요소 빌더 ----------
  function worker(x, z, rotY, name) {
    const g = group(name || '작업자', L.workers);
    g.position.set(x, 0, z);
    g.rotation.y = rotY || 0;
    const b = M(COL.blue), bl = M(COL.blueLight), skin = M(COL.skin);
    box(g, 0.24, 0.85, 0.28, -0.16, 0, b);
    box(g, 0.24, 0.85, 0.28, 0.16, 0, b);
    box(g, 0.66, 0.72, 0.38, 0, 0, b, 0.85);
    const la = box(g, 0.18, 0.62, 0.2, -0.44, 0, bl, 0.95);
    const ra = box(g, 0.18, 0.62, 0.2, 0.44, 0, bl, 0.95);
    la.rotation.x = ra.rotation.x = -0.45;
    la.position.z = ra.position.z = 0.12;
    sphere(g, 0.2, 0, 1.8, 0, skin);
    cyl(g, 0.23, 0.14, 0, 0, b, 1.9);
    return g;
  }

  function robot(parent, x, z, rotY) {
    const g = new THREE.Group();
    g.position.set(x, 0, z);
    g.rotation.y = rotY || 0;
    parent.add(g);
    cyl(g, 0.3, 0.16, 0, 0, M(COL.dark));
    cyl(g, 0.17, 0.55, 0, 0, M(COL.metal), 0.16);
    cyl(g, 0.16, 0.26, 0, 0, M(COL.green), 0.71);
    const ua = new THREE.Group(); ua.position.set(0, 0.84, 0); ua.rotation.x = -0.55; g.add(ua);
    box(ua, 0.2, 0.95, 0.2, 0, 0, M(COL.metal));
    const fa = new THREE.Group(); fa.position.set(0, 0.95, 0); fa.rotation.x = 1.55; ua.add(fa);
    cyl(fa, 0.14, 0.24, 0, 0, M(COL.green), -0.12);
    box(fa, 0.16, 0.75, 0.16, 0, 0, M(COL.metal));
    box(fa, 0.1, 0.28, 0.1, 0, 0, M(COL.dark), 0.75);
    return g;
  }

  function monitor(parent, x, z, rotY, y) {
    const g = new THREE.Group(); g.position.set(x, y || 0, z); g.rotation.y = rotY || 0; parent.add(g);
    box(g, 0.1, 0.3, 0.1, 0, 0, M(COL.metal));
    box(g, 0.72, 0.5, 0.06, 0, 0, M(COL.dark), 0.3);
    box(g, 0.62, 0.4, 0.02, 0, 0.04, M(0x8fc3ff, { emissive: new THREE.Color(0x2b5f9e), emissiveIntensity: 0.5 }), 0.35);
    return g;
  }

  // 대차: 와이어 메시 프레임 카트
  function cart(parent, x, z, w, d, h, opts) {
    opts = opts || {};
    const g = new THREE.Group(); g.position.set(x, 0, z); parent.add(g);
    const post = M(COL.metal);
    const mesh = M(COL.steel, { transparent: true, opacity: 0.42, side: THREE.DoubleSide, depthWrite: false });
    const base = 0.26;
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
      box(g, 0.07, h - base, 0.07, sx * (w / 2 - 0.04), sz * (d / 2 - 0.04), post, base);
      const wheel = rollerX(g, 0.11, 0.07, sx * (w / 2 - 0.15), 0.11, sz * (d / 2 - 0.15), M(COL.rubber));
      rollerX(g, 0.05, 0.09, sx * (w / 2 - 0.15), 0.11, sz * (d / 2 - 0.15), M(COL.yellow));
      wheel.castShadow = false;
    });
    const shelves = opts.shelves || 3;
    for (let k = 0; k < shelves; k++) {
      const y = base + k * ((h - base - 0.15) / (shelves - 1 || 1));
      box(g, w, 0.05, d, 0, 0, post, y);
    }
    if (!opts.open) {
      box(g, w, h - base - 0.05, 0.015, 0, -d / 2 + 0.03, mesh, base);
      box(g, 0.015, h - base - 0.05, d, -w / 2 + 0.03, 0, mesh, base);
      box(g, 0.015, h - base - 0.05, d, w / 2 - 0.03, 0, mesh, base);
    }
    if (opts.top) box(g, w + 0.08, 0.14, d + 0.08, 0, 0, M(COL.rubber), h - 0.08);
    if (opts.rail) {
      box(g, w, 0.06, 0.06, 0, -d / 2, M(COL.yellow), h - 0.02);
      box(g, w, 0.06, 0.06, 0, d / 2, M(COL.yellow), h - 0.02);
    }
    return g;
  }

  function springCart(x, z, size, name) {
    const g = group(name || '스프링대차');
    cart(g, x, z, size, size, 2.4, { shelves: 3, rail: true });
    return g;
  }

  function springCartLow(x, z, name) {
    const g = group(name || '스프링대차');
    cart(g, x, z, 2.3, 1.9, 1.1, { shelves: 2, top: true, open: true });
    box(g, 2.3, 0.05, 0.05, x, z - 0.95, M(COL.yellow), 1.06);
    box(g, 2.3, 0.05, 0.05, x, z + 0.95, M(COL.yellow), 1.06);
    return g;
  }

  function screwStation(x, name) {
    const g = group(name || 'screw 공정');
    box(g, 3.2, 0.9, 2.7, x, 2.1, M(COL.white));
    box(g, 3.2, 0.08, 2.7, x, 2.1, M(COL.metal), 0.9);
    box(g, 3.2, 0.3, 0.16, x, 0.83, M(COL.panel), 1.0);
    robot(g, x - 0.75, 1.55, 0.35);
    monitor(g, x + 1.05, 1.15, 0.2, 0.98);
    box(g, 0.9, 0.28, 0.6, x + 0.35, 2.6, M(COL.steel), 0.98);
    box(g, 0.5, 0.12, 0.4, x + 0.35, 2.6, M(COL.green), 1.26);
    box(g, 3.2, 0.75, 1.6, x, 4.25, M(COL.white));
    worker(x, 5.35, Math.PI);
    return g;
  }

  function screwStationWide(x, name) {
    const g = group(name || 'screw 공정');
    box(g, 4.6, 0.9, 2.4, x, 2.3, M(COL.white));
    box(g, 4.6, 0.08, 2.4, x, 2.3, M(COL.metal), 0.9);
    robot(g, x - 1.3, 1.9, 0.5);
    box(g, 0.7, 0.9, 0.5, x - 0.1, 1.7, M(COL.steel), 0.98);
    cyl(g, 0.12, 0.5, x - 0.1, 2.3, M(COL.dark), 0.98);
    monitor(g, x + 1.55, 1.5, 0.15, 0.98);
    box(g, 1.2, 0.75, 2.4, x - 1.7, 5.4, M(COL.white));
    box(g, 1.2, 0.75, 2.4, x + 1.7, 5.4, M(COL.white));
    worker(x, 5.0, Math.PI);
    return g;
  }

  function packingStation(x, z, name) {
    const g = group(name || '포장');
    box(g, 3.6, 0.85, 2.7, x + 0.7, z, M(COL.white));
    box(g, 3.6, 0.06, 2.7, x + 0.7, z, M(COL.metal), 0.85);
    box(g, 1.0, 0.7, 0.9, x - 0.2, z - 0.4, M(0xc9a36a), 0.91);
    box(g, 1.0, 0.04, 0.9, x - 0.2, z - 0.4, M(0xb08a55), 1.61);
    monitor(g, x + 1.6, z - 0.9, -0.5, 0.91);
    box(g, 0.9, 0.4, 0.8, x + 1.9, z + 0.5, M(COL.steel), 0.91);
    cyl(g, 0.16, 0.9, x + 2.3, z - 1.1, M(COL.metal), 0.91, 16);
    cyl(g, 0.16, 0.9, x - 1.0, z + 1.2, M(COL.metal), 0, 16);
    worker(x - 1.4, z, Math.PI / 2);
    return g;
  }

  function labelRack(x, z, name) {
    const g = group(name || '라벨 보관대');
    const w = 4, d = 3.3, h = 2.0;
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => box(g, 0.08, h, 0.08, x + sx * (w / 2 - 0.05), z + sz * (d / 2 - 0.05), M(COL.metal)));
    box(g, w, 0.08, d, x, z, M(COL.panel), 0.25);
    box(g, w, 0.08, d, x, z, M(COL.panel), h - 0.08);
    box(g, w, h, 0.03, x, z - d / 2 + 0.05, M(COL.panel, { transparent: true, opacity: 0.55 }));
    for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) {
      const bx = x - 1.2 + i * 1.2, bz = z - 0.75 + j * 1.5;

  // ---------- 카메라 제어 ----------
  class Orbit {
    constructor(cam, el, target) {
      this.cam = cam; this.el = el; this.target = target;
      this.sph = new THREE.Spherical();
      this.pointers = new Map();
      this.mode = null; this.lastDist = 0;
      this.minR = 6; this.maxR = 220;
      this.sync();
      el.addEventListener('pointerdown', e => this.down(e));
      el.addEventListener('pointermove', e => this.move(e));
      el.addEventListener('pointerup', e => this.up(e));
      el.addEventListener('pointercancel', e => this.up(e));
      el.addEventListener('wheel', e => { e.preventDefault(); this.sph.radius *= Math.pow(1.0015, e.deltaY); this.update(); }, { passive: false });
      el.addEventListener('contextmenu', e => e.preventDefault());
    }
    sync() { this.sph.setFromVector3(this.cam.position.clone().sub(this.target)); this.update(); }
    update() {
      this.sph.phi = Math.min(Math.max(this.sph.phi, 0.04), Math.PI / 2 - 0.03);
      this.sph.radius = Math.min(Math.max(this.sph.radius, this.minR), this.maxR);
      this.cam.position.copy(this.target).add(new THREE.Vector3().setFromSpherical(this.sph));
      this.cam.lookAt(this.target);
    }
    down(e) {
      this.el.setPointerCapture(e.pointerId);
      this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (this.pointers.size === 2) {
        const p = [...this.pointers.values()];
        this.lastDist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
        this.mode = 'pinch';
      } else {
        this.mode = (e.button === 2 || e.shiftKey || e.ctrlKey) ? 'pan' : 'rotate';
      }
      this.el.classList.add('dragging');
    }
    move(e) {
      const p = this.pointers.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      if (this.mode === 'rotate') {
        this.sph.theta -= dx * 0.005; this.sph.phi -= dy * 0.005;
      } else if (this.mode === 'pan') {
        const k = 2 * this.sph.radius * Math.tan(THREE.MathUtils.degToRad(this.cam.fov / 2)) / this.el.clientHeight;
        const right = new THREE.Vector3().setFromMatrixColumn(this.cam.matrix, 0);
        const up = new THREE.Vector3().setFromMatrixColumn(this.cam.matrix, 1);
        this.target.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
      } else if (this.mode === 'pinch' && this.pointers.size === 2) {
        const q = [...this.pointers.values()];
        const d = Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y);
        if (d > 0 && this.lastDist > 0) this.sph.radius *= this.lastDist / d;
        this.lastDist = d;
      }
      this.update();
    }
    up(e) {
      this.pointers.delete(e.pointerId);
      if (this.pointers.size === 0) { this.mode = null; this.el.classList.remove('dragging'); }
      else if (this.pointers.size === 1) this.mode = 'rotate';
    }
  }

  const VIEWS = {
    iso: [3, 40, 51], top: [0, 78, 0.01], front: [0, 12, 66], back: [0, 36, -55]
  };
  camera.position.copy(TARGET).add(new THREE.Vector3(...VIEWS.iso));
  const orbit = new Orbit(camera, viewEl, TARGET);

  function fit() {
    const w = viewEl.clientWidth, h = viewEl.clientHeight;
    camera.aspect = w / h;
    // 좁은 화면에서는 전체가 보이도록 화각 보정
    camera.fov = w / h < 1.4 ? 38 * Math.min(1.9, 1.4 / (w / h)) : 38;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  fit();
  new ResizeObserver(fit).observe(viewEl);

  document.querySelectorAll('[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
      TARGET.set(F.W / 2, 0, F.D / 2 - 1);
      camera.position.copy(TARGET).add(new THREE.Vector3(...VIEWS[btn.dataset.view]));
      orbit.sync();
    });
  });
  document.querySelectorAll('[data-layer]').forEach(cb => {
    cb.addEventListener('change', () => { L[cb.dataset.layer].visible = cb.checked; });
  });

  // ---------- 호버 이름 표시 ----------
  const tip = document.getElementById('tip');
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let hoverPending = null;
  viewEl.addEventListener('pointermove', e => {
    if (e.buttons) { tip.hidden = true; return; }
    hoverPending = { x: e.clientX, y: e.clientY };
  });
  viewEl.addEventListener('pointerleave', () => { tip.hidden = true; hoverPending = null; });
  function pick() {
    if (!hoverPending) return;
    const { x, y } = hoverPending; hoverPending = null;
    const r = viewEl.getBoundingClientRect();
    ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObjects(scene.children, true);
    let name = null;
    for (const h of hits) {
      if (h.object.isSprite || h.object.isLine) continue;
      let o = h.object;
      while (o && !o.userData.name) o = o.parent;
      name = o ? o.userData.name : null;
      break;
    }
    if (name) { tip.textContent = name; tip.style.left = (x - r.left) + 'px'; tip.style.top = (y - r.top) + 'px'; tip.hidden = false; }
    else tip.hidden = true;
  }

  // ---------- 렌더 루프 ----------
  function frame() {
    pick();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  document.getElementById('loading').remove();
  frame();
  // 외부 내보내기(GLB 등)용 접근점
  window.__layout = { scene, layers: L, THREE };
  }
})();
