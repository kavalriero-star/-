<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFFFFF">
<title>라인별 생산 현황 · 엘레멕</title>
<style>
:root {
  --bg: #FFFFFF;
  --bg-sunken: #FAF9F7;
  --text: #1C1A17;
  --text-muted: #57534E;
  --border: #E3E0DB;
  --border-strong: #8C857C;

  --accent: #1F5F8B;
  --accent-text: #FFFFFF;

  --st-ok: #16794C;
  --st-warn: #A15C07;
  --st-error: #B42318;
  --st-idle: #57534E;

  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px;
  --sp-4: 16px; --sp-6: 24px; --sp-8: 32px;

  --font-sans: system-ui, -apple-system, "Apple SD Gothic Neo",
               "Malgun Gothic", "맑은 고딕", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
}

/* 키보드 사용자를 위한 본문 바로가기 */
.skip {
  position: absolute;
  left: -9999px;
  top: var(--sp-2);
  background: var(--accent);
  color: var(--accent-text);
  padding: var(--sp-2) var(--sp-3);
  border-radius: 4px;
  z-index: 10;
}
.skip:focus { left: var(--sp-2); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.wrap { max-width: 1120px; margin: 0 auto; padding: var(--sp-6) var(--sp-4); }

header { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; }
h1 { font-size: 20px; font-weight: 600; margin: 0; text-wrap: balance; }
h2 { font-size: 16px; font-weight: 600; margin: var(--sp-8) 0 var(--sp-3); }
.updated { font-size: 13px; color: var(--text-muted); }
.updated .num { font-variant-numeric: tabular-nums; }

/* ── 필터 ── */
.filters {
  display: flex; flex-wrap: wrap; gap: var(--sp-3);
  align-items: flex-end;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: var(--sp-4);
  margin-top: var(--sp-4);
}
.field { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
.field label { font-size: 13px; color: var(--text-muted); }
select, input[type="search"] {
  font: inherit;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  padding: 6px var(--sp-2);
  min-height: 34px;
}

.btn {
  font: inherit;
  min-height: 34px;
  padding: 6px var(--sp-4);
  border-radius: 4px;
  border: 1px solid transparent;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.btn--primary { background: var(--accent); color: var(--accent-text); }
.btn--primary:hover { background: #184D71; }
.btn--quiet { background: var(--bg); color: var(--text); border-color: var(--border-strong); }
.btn--quiet:hover { background: var(--bg-sunken); }
.btn--danger { background: var(--bg); color: var(--st-error); border-color: var(--st-error); }
.btn--danger:hover { background: #FDF3F2; }

/* ── 표 ── */
.table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; min-width: 760px; }
caption { text-align: left; padding: var(--sp-3) var(--sp-4); color: var(--text-muted); font-size: 13px; }
th, td { padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--border); text-align: left; }
thead th {
  position: sticky; top: 0;
  background: var(--bg-sunken);
  font-size: 13px; font-weight: 600;
  border-bottom: 1px solid var(--border-strong);
}
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--bg-sunken); }

/* 숫자 열: 자릿수가 어긋나면 오독이 생긴다 */
.num { font-variant-numeric: tabular-nums; text-align: right; }
th.num { text-align: right; }

/* 긴 품명이 레이아웃을 무너뜨리지 않게 */
.name { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── 상태: 색 + 글자를 항상 함께 ── */
.badge {
  display: inline-block;
  font-size: 13px;
  padding: 1px var(--sp-2);
  border-radius: 4px;
  border: 1px solid currentColor;
  white-space: nowrap;
}
.badge--ok    { color: var(--st-ok); }
.badge--warn  { color: var(--st-warn); }
.badge--error { color: var(--st-error); }
.badge--idle  { color: var(--st-idle); }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.empty { padding: var(--sp-8) var(--sp-4); text-align: center; color: var(--text-muted); }

.actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-4); }

.note {
  margin-top: var(--sp-8);
  padding-top: var(--sp-4);
  border-top: 1px solid var(--border);
  font-size: 13px;
  color: var(--text-muted);
}
</style>
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>

<div class="wrap">
  <header>
    <h1>라인별 생산 현황</h1>
    <p class="updated">갱신 <span class="num" id="updated">—</span></p>
  </header>

  <main id="main">
    <h2>조회 조건</h2>
    <form class="filters" id="filters">
      <div class="field">
        <label for="line">생산 라인</label>
        <select id="line" name="line" autocomplete="off">
          <option value="">전체</option>
          <option value="A">A라인</option>
          <option value="B">B라인</option>
          <option value="C">C라인</option>
        </select>
      </div>

      <div class="field">
        <label for="state">상태</label>
        <select id="state" name="state" autocomplete="off">
          <option value="">전체</option>
          <option value="ok">정상</option>
          <option value="warn">주의</option>
          <option value="error">이상</option>
          <option value="idle">대기</option>
        </select>
      </div>

      <div class="field">
        <label for="q">품번 · 품명</label>
        <input id="q" name="q" type="search" inputmode="search"
               autocomplete="off" spellcheck="false"
               placeholder="예: EM-1042…">
      </div>

      <button class="btn btn--primary" type="submit">조회</button>
      <button class="btn btn--quiet" type="button" id="reset">조건 초기화</button>
    </form>

    <h2>생산 실적</h2>
    <!-- 표가 숨겨져도 결과 건수는 알려야 하므로 표 바깥에 둔다 -->
    <p class="sr-only" id="count" role="status" aria-live="polite"></p>
    <div class="table-scroll">
      <table id="table">
        <caption id="caption">조건에 맞는 항목을 표시합니다.</caption>
        <thead>
          <tr>
            <th scope="col">라인</th>
            <th scope="col">품번</th>
            <th scope="col">품명</th>
            <th scope="col" class="num">계획</th>
            <th scope="col" class="num">실적</th>
            <th scope="col" class="num">달성률</th>
            <th scope="col" class="num">불량</th>
            <th scope="col">상태</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty" id="empty" hidden>조건에 맞는 항목이 없습니다.</p>
    </div>

    <div class="actions">
      <button class="btn btn--danger" type="button" id="close-shift">교대 실적 마감</button>
    </div>

    <p class="note" role="status" aria-live="polite" id="status"></p>
  </main>
</div>

<script>
const DATA = [
  { line: "A", code: "EM-1042", name: "브래킷 하우징 어셈블리 좌측", plan: 1200, done: 1188, defect:  6, state: "ok"    },
  { line: "A", code: "EM-1043", name: "브래킷 하우징 어셈블리 우측", plan: 1200, done:  940, defect: 31, state: "warn"  },
  { line: "B", code: "EM-2210", name: "커넥터 캡",                   plan:  800, done:  802, defect:  2, state: "ok"    },
  { line: "B", code: "EM-2214", name: "커넥터 하우징",               plan:  800, done:  310, defect: 47, state: "error" },
  { line: "C", code: "EM-3001", name: "샤프트 가이드",               plan:  500, done:    0, defect:  0, state: "idle"  },
];

const LABEL = { ok: "정상", warn: "주의", error: "이상", idle: "대기" };

const nf = new Intl.NumberFormat("ko-KR");
const pf = new Intl.NumberFormat("ko-KR", { style: "percent", maximumFractionDigits: 1 });
const df = new Intl.DateTimeFormat("ko-KR", { dateStyle: "short", timeStyle: "short" });

const $ = (id) => document.getElementById(id);

function render() {
  const p = new URLSearchParams(location.search);
  const line = p.get("line") || "";
  const state = p.get("state") || "";
  const q = (p.get("q") || "").trim().toLowerCase();

  $("line").value = line;
  $("state").value = state;
  $("q").value = p.get("q") || "";

  // DESIGN.md: 50행을 넘으면 가상 스크롤로 바꿀 것 (통째로 그리지 않는다)
  const rows = DATA.filter((r) =>
    (!line || r.line === line) &&
    (!state || r.state === state) &&
    (!q || r.code.toLowerCase().includes(q) || r.name.toLowerCase().includes(q))
  );

  const tbody = $("rows");
  tbody.replaceChildren();
  for (const r of rows) {
    const tr = document.createElement("tr");
    const add = (text, cls, opts = {}) => {
      const td = document.createElement("td");
      td.textContent = text;                 // 문자열 조립 대신 textContent — 주입 차단
      if (cls) td.className = cls;
      if (opts.title) td.title = text;
      if (opts.noTranslate) td.translate = false;
      tr.append(td);
      return td;
    };
    add(`${r.line}라인`);
    add(r.code, null, { noTranslate: true }); // 품번은 자동번역되면 안 됨
    add(r.name, "name", { title: true });
    add(nf.format(r.plan), "num");
    add(nf.format(r.done), "num");
    add(pf.format(r.plan ? r.done / r.plan : 0), "num");
    add(nf.format(r.defect), "num");
    const st = add("", null);
    const badge = document.createElement("span");
    badge.className = `badge badge--${r.state}`;
    badge.textContent = LABEL[r.state];       // 색 + 글자를 항상 함께
    st.append(badge);
    tbody.append(tr);
  }

  // 0건이면 표 자체를 감춘다 — 머리글만 남은 빈 표를 그리지 않는다
  const isEmpty = rows.length === 0;
  $("table").hidden = isEmpty;
  $("empty").hidden = !isEmpty;
  $("caption").textContent = `총 ${nf.format(rows.length)}건`;
  $("count").textContent = `조회 결과 ${nf.format(rows.length)}건`;
  $("updated").textContent = df.format(new Date());
}

$("filters").addEventListener("submit", (e) => {
  e.preventDefault();
  const p = new URLSearchParams();
  for (const [k, v] of new FormData(e.target)) if (v) p.set(k, v);
  history.pushState(null, "", p.toString() ? `?${p}` : location.pathname);
  render();
});

$("reset").addEventListener("click", () => {
  history.pushState(null, "", location.pathname);
  render();
});

// 되돌리기 어려운 동작에는 확인을 둔다
$("close-shift").addEventListener("click", () => {
  if (confirm("교대 실적을 마감하면 이후 수정할 수 없습니다. 계속할까요?")) {
    $("status").textContent = "교대 실적을 마감했습니다.";
  }
});

addEventListener("popstate", render);
render();
</script>
</body>
</html>
