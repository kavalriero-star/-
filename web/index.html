<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>엘레멕 원가계산 프로그램</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3a5f'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3E₩%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- 앱바 -->
    <header class="appbar">
      <div class="brand"><span class="logo">원</span> 엘레멕 원가계산</div>
      <div class="proj-switch">
        <select id="projSelect" class="proj-select" title="견적 선택"></select>
        <button class="btn btn-ghost btn-sm" id="btnNewProj" title="백지에서 새 견적 만들기">＋ 새 견적</button>
        <button class="btn btn-ghost btn-sm" id="btnDelProj" title="현재 견적 삭제">🗑</button>
      </div>
      <div class="meta" id="projMeta">불러오는 중…</div>
      <div class="spacer"></div>
      <span class="warn-badge" id="warnBadge" style="display:none"></span>
      <div class="calc-status" id="calcStatus"><span class="dot"></span><span id="calcStatusText">준비</span></div>
      <div class="actions">
        <button class="btn btn-ghost btn-sm" id="btnTheme" title="테마 전환">◐</button>
        <button class="btn btn-ghost btn-sm" id="btnLoad">불러오기</button>
        <button class="btn btn-ghost btn-sm" id="btnSave">저장</button>
        <button class="btn btn-ghost btn-sm" id="btnReset">초기화</button>
        <button class="btn btn-primary btn-sm" id="btnExport">⬇ 엑셀 다운로드</button>
      </div>
    </header>

    <!-- 사이드바 -->
    <aside class="sidebar">
      <div class="nav-group">
        <h4>대시보드</h4>
        <div class="nav-item" data-view="summary"><span class="ic">▤</span> 견적 요약</div>
        <div class="nav-item" data-view="scenario"><span class="ic">▦</span> 판가 시나리오</div>
        <div class="nav-item" data-view="competitor"><span class="ic">⚖</span> 경쟁사 비교</div>
        <div class="nav-item" data-view="bep"><span class="ic">◭</span> 손익 · BEP</div>
      </div>
      <div class="nav-group">
        <h4>조립품 (ASSY) <span class="nav-add" id="addAssy" title="신규 조립품 추가">＋</span></h4>
        <div id="navAssemblies"></div>
      </div>
      <div class="nav-group">
        <h4>사출품 (사출) <span class="nav-add" id="addPart" title="신규 사출품 추가">＋</span></h4>
        <div id="navParts"></div>
      </div>
      <div class="nav-group">
        <h4>마스터</h4>
        <div class="nav-item" data-view="master"><span class="ic">⚙</span> 기준 · 상수</div>
      </div>
    </aside>

    <!-- 메인 -->
    <main class="main"><div class="view" id="view"></div></main>
  </div>

  <div class="toast-wrap" id="toasts"></div>
  <input type="file" id="fileInput" accept=".json" style="display:none">

  <script src="js/util.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
