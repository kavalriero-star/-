name: Build executables

# 푸시 시 Windows / macOS / Linux 실행파일을 자동 빌드하여 Artifacts 로 업로드합니다.
# 다운로드: 이 저장소 Actions 탭 -> 해당 실행 -> Artifacts 에서 받기 (Python 설치 불필요)

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: iBoxInspector-windows
          - os: macos-latest
            artifact: iBoxInspector-macos
          - os: ubuntu-latest
            artifact: iBoxInspector-linux
    defaults:
      run:
        working-directory: ibox_inspector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build executables
        run: pyinstaller --clean -y ibox_inspector.spec

      - name: Smoke test CLI (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./dist/ibox-cli --image data/samples/box.jpg

      - name: Smoke test CLI (Windows)
        if: runner.os == 'Windows'
        run: .\dist\ibox-cli.exe --image data/samples/box.jpg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ibox_inspector/dist/*
          if-no-files-found: error

  # 빌드된 실행파일을 공개 Release 로 업로드 -> 로그인 없이 링크로 바로 다운로드
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip per platform
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            (cd "$d" && zip -r "../${name}.zip" .)
          done
          ls -la

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: iBox Inspector 최신 실행파일
          body: |
            박스 칸별 제품 유무 검사기 자동 빌드입니다. OS에 맞는 zip 을 받아 압축을 풀고
            iBoxInspector(.exe) 를 실행하세요. (Windows: iBoxInspector-windows.zip)
          files: artifacts/*.zip
          prerelease: false
          make_latest: true
